services:

  postgres:
    image: postgres:17
    container_name: filafacil-postgres

    env_file:
      - .env

    ports:
      - "5432:5432"

  api-blue:
    build: .
    container_name: filafacil-blue

    env_file:
      - .env

    ports:
      - "8080:8080"

    depends_on:
      - postgres

  api-green:
    build: .
    container_name: filafacil-green

    env_file:
      - .env

    ports:
      - "8081:8080"

    depends_on:
      - postgres
