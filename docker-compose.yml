services:
  postgres:
    image: postgres:17
    container_name: filafacil-postgres
    environment:
      POSTGRES_DB: filafacil
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2604
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: