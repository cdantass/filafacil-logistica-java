services:

  postgres:
    image: postgres:17
    container_name: filafacil-postgres
    environment:
      POSTGRES_DB: filafacil
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 2604
    ports:
      - "5432:5432"

  redis:
    image: redis:8
    container_name: filafacil-redis
    ports:
      - "6379:6379"

  mongodb:
    image: mongo
    container_name: filafacil-mongodb
    ports:
      - "27017:27017"