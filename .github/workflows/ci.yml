name: CI-CD

on:
  push:
    branches: [main, juniorDevOps, "feat/**"]
  pull_request:
    branches: [main, juniorDevOps]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: filafacil
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/filafacil
      DB_USER: postgres
      DB_PASSWORD: ci-password
      APP_ENV: CI

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Testes e build
        run: mvn -B verify

      - name: Upload do JAR
        uses: actions/upload-artifact@v4
        with:
          name: filafacil-devops-api
          path: target/*.jar

      - name: Login Docker Hub
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/juniorDevOps')
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build e push da imagem
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/juniorDevOps')
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/filafacil-devops-api:latest .
          docker push ${{ secrets.DOCKER_USERNAME }}/filafacil-devops-api:latest
