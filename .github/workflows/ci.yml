name: CI

on:
  push:
    branches:
      - main
      - junior

  pull_request:
    branches:
      - main
      - junior

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-

      - name: Compilar
        run: mvn clean compile

      - name: Executar Testes
        run: mvn test

      - name: Gerar Artefato
        run: mvn package

      - name: Upload do JAR
        uses: actions/upload-artifact@v4
        with:
          name: filafacil-jar
          path: target/*.jar
