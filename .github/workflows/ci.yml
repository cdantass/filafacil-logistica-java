name: CI-CD

on:
  push:
    branches:
      - main
      - juniorDevOps

  pull_request:
    branches:
      - main
      - juniorDevOps

jobs:

  build-and-publish:

    runs-on: ubuntu-latest

    services:

      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: filafacil
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 2604

        ports:
          - 5432:5432

        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_URL: jdbc:postgresql://localhost:5432/filafacil
      DB_USER: postgres
      DB_PASSWORD: 2604
      APP_ENV: CI

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Cache Maven
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-

      - name: Executar Testes
        run: mvn test

      - name: Gerar Package
        run: mvn clean package -DskipTests

      - name: Upload do JAR
        uses: actions/upload-artifact@v4
        with:
          name: filafacil-devops-api
          path: target/*.jar

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/filafacil-devops-api:latest .

      - name: Push Docker Image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/filafacil-devops-api:latest
